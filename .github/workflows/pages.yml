# main 에 push 하면 웹을 Docker 로 띄워 화면을 정적 페이지로 내보내고 GitHub Pages 에 게시한다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: 웹 기동 (Docker)
        run: docker compose up --build -d
      - name: 기동 대기
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/web/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: 정적 페이지 내보내기
        run: bash scripts/export-static.sh _site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
