# main 에 push 하면 웹을 Docker 로 띄워 화면을 정적 페이지로 내보내고 GitHub Pages 에 게시한다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 확인 코드. 저장소 Settings > Secrets and variables > Actions 의 GATE_CODE
      GATE_CODE: ${{ secrets.GATE_CODE }}
    steps:
      - name: 확인 코드 설정 여부 확인
        run: test -n "$GATE_CODE" || { echo "::error::GATE_CODE secret 이 없습니다. 잠금 없이 게시되지 않도록 중단합니다."; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
      - name: 웹 기동 (Docker)
        run: docker compose up --build -d
      - name: 기동 대기
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/web/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: 정적 페이지 내보내기
        run: bash _scripts/export-static.sh _site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
